[project]
name = "vid-ekyc-backend"
version = "0.1.0"
description = "V-ID eKYC API"
requires-python = ">=3.11,<4.0"
dependencies = [
  "fastapi[standard]>=0.114.2,<1.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "sqlmodel>=0.0.21,<1.0.0",
  "pydantic-settings>=2.2.1,<3.0.0",
  "psycopg[binary]>=3.1.13,<4.0.0",
  "cryptography>=42.0.0,<46.0.0",
  "httpx>=0.25.1,<1.0.0",
  "numpy>=1.24,<3",
  "onnxruntime>=1.16,<2",
  "rapidocr==3.9.2",
  "pillow>=10,<13",
  "vosk==0.3.45",
  "torch>=2.2,<3",
  "torchvision>=0.17,<1",
  "ultralytics>=8.3,<9",
  "vietocr>=0.3.13,<1.0.0",
  # vietocr's gdown dependency imports pkg_resources, which setuptools>=81
  # dropped - pin below that so it's actually importable.
  "setuptools<81",
  "av>=18.1.0",
]

[dependency-groups]
# Everything here is excluded from the Docker image (Dockerfile runs
# `uv sync --frozen --no-dev`).
dev = [
  "pytest>=8.0.0,<9.0.0",
  "ruff>=0.8.0,<1.0.0",
  "mypy>=1.8.0,<2.0.0",
  # benchmark_only: lets benchmark/runners/lip_sync_runner.py run SyncNet
  # locally, in-process (no Docker/HTTP microservice), never shipped in the
  # runtime image.
  "syncnet-python>=0.2.2,<1.0.0",
  "scenedetect[opencv]==0.6.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ai_modules"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
