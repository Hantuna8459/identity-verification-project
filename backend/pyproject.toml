[project]
name = "vid-ekyc-backend"
version = "0.1.0"
description = "V-ID eKYC API"
requires-python = ">=3.11,<4.0"
dependencies = [
  "fastapi[standard]>=0.114.2,<1.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "sqlmodel>=0.0.21,<1.0.0",
  "pydantic-settings>=2.2.1,<3.0.0",
  "psycopg[binary]>=3.1.13,<4.0.0",
  "cryptography>=42.0.0,<46.0.0",
  "httpx>=0.25.1,<1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0,<9.0.0",
  "ruff>=0.8.0,<1.0.0",
  "mypy>=1.8.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
